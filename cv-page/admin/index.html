<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV Page Control Panel</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:0 auto;padding:32px 18px 70px}
header{background:#111827;color:#fff;border-radius:18px;padding:24px;margin-bottom:20px}
h1{margin:0 0 6px;font-size:28px}header p{margin:0;color:#cbd5e1}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 30px rgba(17,24,39,.05)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}
label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px 12px;font:inherit}textarea{min-height:110px;resize:vertical}
.card{border:1px solid #dbe3ef;border-radius:14px;padding:16px;margin:12px 0;background:#fafcff}.cardtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cardtop strong{font-size:14px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.add{background:#e8eefc;color:#1e3a8a}.remove{background:#fee2e2;color:#991b1b}.save{background:#1e3a8a;color:#fff;font-size:15px;padding:13px 20px}.preview{background:#111827;color:#fff;margin-left:8px}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.status{font-size:13px;color:#475569}.locked{max-width:420px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>CV Page Control Panel</h1><p>Edit the public CV page, add/remove cards, then publish directly to GitHub → Render.</p></header>

<section class="panel" id="loginPanel">
  <div class="locked">
    <label>Admin Password</label>
    <input id="password" type="password" placeholder="Enter your CV admin password">
    <button class="save" style="margin-top:10px" onclick="loadCV()">Unlock</button>
    <p class="status" id="loginStatus"></p>
  </div>
</section>

<main id="editor" hidden>
<section class="panel">
<h2>Page Content</h2>
<div class="grid">
<div><label>Name</label><input id="name"></div>
<div><label>Role</label><input id="role"></div>
<div><label>Main Headline</label><input id="headline"></div>
<div><label>Intro / Paragraph</label><textarea id="intro"></textarea></div>
<div class="full"><label>Supporting Text</label><textarea id="subtext"></textarea></div>
</div>
</section>

<section class="panel">
<div class="cardtop"><h2 style="margin:0">Cards</h2><button class="add" onclick="addCard()">+ Add New Card</button></div>
<div id="cards"></div>
</section>

<section class="panel">
<div class="actions">
<button class="save" onclick="saveCV()">SAVE & PUBLISH</button>
<button class="preview" onclick="window.open('/cv-page/?v='+Date.now(),'_blank')">OPEN CV PAGE</button>
<span class="status" id="status"></span>
</div>
</section>
</main>
</div>
<script>
let cv={cards:[]}, password="";
const $=id=>document.getElementById(id);
function render(){
 $("name").value=cv.name||"";$("role").value=cv.role||"";$("headline").value=cv.headline||"";
 $("intro").value=cv.intro||"";$("subtext").value=cv.subtext||"";
 $("cards").innerHTML="";
 cv.cards.forEach((c,i)=>{
   const el=document.createElement("div");el.className="card";
   el.innerHTML=`<div class="cardtop"><strong>Card ${i+1}</strong><button class="remove" onclick="removeCard(${i})">Remove</button></div>
   <div class="grid">
   <div><label>Label / Eyebrow</label><input data-i="${i}" data-k="label" value="${esc(c.label)}"></div>
   <div><label>Title</label><input data-i="${i}" data-k="title" value="${esc(c.title)}"></div>
   <div class="full"><label>Text / Paragraph</label><textarea data-i="${i}" data-k="text">${esc(c.text)}</textarea></div>
   </div>`;
   $("cards").appendChild(el);
 });
}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function sync(){
 cv.name=$("name").value;cv.role=$("role").value;cv.headline=$("headline").value;cv.intro=$("intro").value;cv.subtext=$("subtext").value;
 document.querySelectorAll("[data-i]").forEach(x=>{cv.cards[+x.dataset.i][x.dataset.k]=x.value});
}
function addCard(){sync();cv.cards.push({label:"",title:"TEN YEARS",text:"STACKED."});render();window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
function removeCard(i){cv.cards.splice(i,1);render()}
async function loadCV(){
 password=$("password").value;
 if(!password){$("loginStatus").textContent="Enter the admin password.";return}
 const r=await fetch("/api/cv");cv=await r.json();render();$("loginPanel").hidden=true;$("editor").hidden=false;
}
async function saveCV(){
 sync();$("status").textContent="Publishing to GitHub…";
 const r=await fetch("/api/cv",{method:"POST",headers:{"Content-Type":"application/json","x-cv-admin-password":password},body:JSON.stringify(cv)});
 const data=await r.json();
 if(!r.ok){$("status").textContent=data.error||"Publish failed.";return}
 $("status").textContent="Published. Render is deploying the update…";
 setTimeout(()=>window.open("/cv-page/?v="+Date.now(),"_blank"),2500);
}
</script>
</body>
</html>
