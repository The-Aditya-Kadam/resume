<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aditya Kadam — CV</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh}.page{max-width:1180px;margin:auto;padding:42px 24px 70px}
header{text-align:center;padding:20px 0 30px;border-bottom:1px solid #e5e7eb}h1{font-size:clamp(28px,5vw,52px);margin:0;font-weight:800;letter-spacing:-1px}header .role{margin-top:10px;color:#1e3a8a;letter-spacing:5px;font-size:13px;font-weight:700}
.hero{text-align:center;padding:70px 10px 40px}.hero h2{font-size:clamp(48px,9vw,96px);margin:0;font-weight:900;letter-spacing:-4px}.hero h2 span{color:#1e3a8a}.hero p{max-width:760px;margin:18px auto 0;font-size:20px;line-height:1.6;color:#374151}.sub{font-size:16px!important;color:#64748b!important}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:30px}.card{padding:28px;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 12px 35px rgba(17,24,39,.06)}.label{font-size:12px;font-weight:800;letter-spacing:2px;color:#1e3a8a;text-transform:uppercase}.card h3{font-size:30px;margin:9px 0}.card p{color:#4b5563;line-height:1.65;margin:0}
footer{text-align:center;margin-top:60px;color:#94a3b8;font-size:12px}
@media(max-width:600px){.page{padding:25px 16px}.hero{padding-top:50px}.hero h2{letter-spacing:-2px}}
</style>
</head>
<body>
<div class="page">
<header><h1 id="name">ADITYA SHASHIKANT KADAM</h1><div class="role" id="role">ASSISTANT TECHNICAL PROJECT MANAGER</div></header>
<section class="hero"><h2 id="headline">COMING <span>SOON</span></h2><p id="intro">My detailed CV page is under development.</p><p class="sub" id="subtext">Stay tuned for the complete version with more details.</p><div class="cards" id="cards"></div></section>
<footer>CV Page • Updated from the CV Control Panel</footer>
</div>
<script>
(async()=>{try{
 const r=await fetch("./data.json?v="+Date.now());const d=await r.json();
 document.getElementById("name").textContent=d.name||"";
 document.getElementById("role").textContent=d.role||"";
 document.getElementById("headline").innerHTML=(d.headline||"COMING SOON").replace(/^(.*?)(?:\s+)([^\s]+)$/,'$1 <span>$2</span>');
 document.getElementById("intro").textContent=d.intro||"";
 document.getElementById("subtext").textContent=d.subtext||"";
 document.getElementById("cards").innerHTML=(d.cards||[]).map(c=>`<article class="card"><div class="label">${esc(c.label)}</div><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></article>`).join("");
}catch(e){console.error(e)}})();
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
</script>
</body>
</html>
