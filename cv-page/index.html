<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aditya Kadam — CV</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#fff}
*{box-sizing:border-box}body{margin:0}.page{max-width:1180px;margin:auto;padding:42px 24px 70px}header{text-align:center;padding:20px 0 30px;border-bottom:1px solid #e5e7eb}h1{font-size:clamp(28px,5vw,52px);margin:0;font-weight:800}header .role{margin-top:10px;color:#1e3a8a;letter-spacing:4px;font-size:13px;font-weight:700}.contact{margin-top:18px;color:#64748b;font-size:13px;line-height:1.7}.hero{text-align:center;padding:58px 10px 35px}.hero h2{font-size:clamp(40px,7vw,78px);margin:0;font-weight:900;letter-spacing:-3px}.hero h2 span{color:#1e3a8a}.hero p{max-width:850px;margin:18px auto 0;font-size:18px;line-height:1.65;color:#374151}.sub{font-size:14px!important;color:#64748b!important}.section{margin-top:42px}.section h2{font-size:14px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #111827;padding-bottom:8px;margin:0 0 18px}.summary{line-height:1.7;color:#374151}.competency{margin:14px 0}.competency strong{display:block}.competency span{color:#4b5563;line-height:1.6}.experience{padding:18px 0;border-bottom:1px solid #e5e7eb}.experience h3{margin:0 0 4px;font-size:18px}.meta{color:#64748b;font-size:13px}.experience ul{margin:10px 0;padding-left:20px;color:#374151;line-height:1.65}.achievement{font-size:13px;font-weight:700}.simple-item{padding:10px 0;border-bottom:1px solid #eef2f7}.simple-item strong{display:block}.simple-item span{color:#64748b;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{padding:26px;border:1px solid #e5e7eb;border-radius:18px}.label{font-size:12px;font-weight:800;letter-spacing:2px;color:#1e3a8a;text-transform:uppercase}.card h3{font-size:26px;margin:8px 0}.card p{color:#4b5563;line-height:1.65;margin:0}footer{text-align:center;margin-top:60px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<div class="page">
<header><h1 id="name">ADITYA SHASHIKANT KADAM</h1><div class="role" id="role">ASSISTANT TECHNICAL PROJECT MANAGER</div><div class="contact" id="contact"></div></header>
<section class="hero"><h2 id="headline">CV <span>PREVIEW</span></h2><p id="intro"></p><p class="sub" id="subtext"></p></section>
<div id="content"></div>
<footer>CV Page</footer>
</div>
<script>
const KEY="aditya-kadam-cv-draft";
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function text(v){return esc(v)}
function section(title,html){return '<section class="section"><h2>'+text(title)+'</h2>'+html+'</section>'}
async function getData(){
  const preview=new URLSearchParams(window.location.search).has("preview");
  if(preview){
    const saved=localStorage.getItem(KEY);
    if(saved){try{return JSON.parse(saved)}catch{}}
  }
  try{
    const r=await fetch("https://aditya-cv-api.onrender.com/api/cv?v="+Date.now(),{cache:"no-store"});
    if(r.ok){const result=await r.json();return result.data;}
  }catch(e){}
  const saved=localStorage.getItem(KEY);
  if(saved){try{return JSON.parse(saved)}catch{}}
  const r=await fetch("./data.json?v="+Date.now());
  return r.json();
}
(async()=>{
 try{
  const d=await getData();
  document.title=(d.name||"CV")+" — CV";
  document.getElementById("name").textContent=d.name||"";
  document.getElementById("role").textContent=d.role||"";
  document.getElementById("contact").innerHTML=[d.location,d.phone,d.email,d.linkedin,d.github,d.portfolio].filter(Boolean).map(text).join(" &nbsp;|&nbsp; ");
  const headline=d.headline||"CV PREVIEW";
  document.getElementById("headline").innerHTML=text(headline).replace(/^(.*?)(?:\s+)([^\s]+)$/,'$1 <span>$2</span>');
  document.getElementById("intro").textContent=d.summary||d.intro||"";
  document.getElementById("subtext").textContent=d.subtext||d.targetLocations||"";
  let html="";
  if(d.summary) html+=section("Professional Summary",'<div class="summary">'+text(d.summary)+'</div>');
  if((d.competencies||[]).length) html+=section("Core Competencies & Technical Toolkit",d.competencies.map(x=>'<div class="competency"><strong>'+text(x.title)+'</strong><span>'+text(x.text)+'</span></div>').join(""));
  if((d.experience||[]).length) html+=section("Professional Experience",d.experience.map(x=>'<article class="experience"><h3>'+text(x.role)+'</h3><div class="meta">'+text(x.company)+' &nbsp;|&nbsp; '+text(x.dates)+'</div><ul>'+(x.bullets||[]).filter(Boolean).map(b=>'<li>'+text(b)+'</li>').join("")+'</ul>'+(x.achievement?'<div class="achievement">'+text(x.achievement)+'</div>':'')+'</article>').join(""));
  if((d.education||[]).length) html+=section("Education",d.education.map(x=>'<div class="simple-item"><strong>'+text(x.qualification)+'</strong><span>'+text(x.institution)+' &nbsp;|&nbsp; '+text(x.dates)+(x.details?' &nbsp;|&nbsp; '+text(x.details):'')+'</span></div>').join(""));
  if((d.certifications||[]).length) html+=section("Certifications",d.certifications.map(x=>'<div class="simple-item"><strong>'+text(x.title)+'</strong><span>'+text(x.issuer)+' &nbsp;|&nbsp; '+text(x.date)+(x.details?' &nbsp;|&nbsp; '+text(x.details):'')+'</span></div>').join(""));
  if((d.awards||[]).length) html+=section("Leadership & Awards",d.awards.map(x=>'<div class="simple-item"><strong>'+text(x.title)+'</strong><span>'+text(x.issuer)+' &nbsp;|&nbsp; '+text(x.date)+'</span></div>').join(""));
  if((d.customSections||[]).length) html+=section("Additional Sections",'<div class="cards">'+d.customSections.map(x=>'<article class="card"><div class="label">'+text(x.label)+'</div><h3>'+text(x.title)+'</h3><p>'+text(x.text)+'</p></article>').join("")+'</div>');
  if((d.cards||[]).length) html+=section("Cards",'<div class="cards">'+d.cards.map(x=>'<article class="card"><div class="label">'+text(x.label)+'</div><h3>'+text(x.title)+'</h3><p>'+text(x.text)+'</p></article>').join("")+'</div>');
  document.getElementById("content").innerHTML=html;
 }catch(e){document.getElementById("content").textContent="Unable to load CV data."}
})();
</script>
</body>
</html>
