<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Section position and protected publishing checks</title><style>body{font:16px system-ui;margin:20px}iframe{height:700px;margin:20px 0;border:1px solid #ccc;display:block}section{overflow:auto}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Section position and publishing checks</h1><p>All Save/Rollback requests are intercepted in temporary memory. No production writes.</p><button id="run">Run checks</button><pre id="results">Ready.</pre><section id="frames"></section><script>
const output=document.getElementById('results'),line=s=>output.textContent+=s+'\n',check=(v,s)=>{if(!v)throw Error(s);line('PASS — '+s);},pause=ms=>new Promise(r=>setTimeout(r,ms));async function ready(fn){for(let i=0;i<400;i++){try{if(fn())return;}catch{}await pause(25);}throw Error('Frame timed out');}
document.getElementById('run').onclick=async()=>{output.textContent='';document.getElementById('run').disabled=true;try{
 const snapshot=await(await fetch('https://aditya-cv-api.onrender.com/api/cv',{cache:'no-store'})).json(),admin=await(await fetch('/cv-management/?positionTest=1',{cache:'no-store'})).text(),pub=(await(await fetch('/?positionTest=1',{cache:'no-store'})).text()).replace(/<!-- Google Tag Manager -->[\s\S]*?<!-- End Google Tag Manager -->/,'');
 const shim='<script>window.CV_TEST_TRANSPORT=true;window.mockWrites=0;window.testErrors=[];addEventListener("error",e=>testErrors.push(e.message));addEventListener("unhandledrejection",e=>testErrors.push(String(e.reason)));let saved='+JSON.stringify(snapshot).replace(/</g,'\\u003c')+',history=[];const originalFetch=fetch.bind(window);window.fetch=async(url,opts={})=>{if(String(url).startsWith("https://aditya-cv-api.onrender.com/api/")){if(opts.method&&opts.method!=="GET"){mockWrites++;if(opts.headers["X-CV-Publish-Key"]!=="synthetic-test-publish-key")return new Response(JSON.stringify({error:"Invalid key"}),{status:401});if(String(url).endsWith("/rollback"))saved=history.pop();else{history.push(JSON.parse(JSON.stringify(saved)));saved={...saved,data:JSON.parse(opts.body).data,version:saved.version+1};}}return new Response(JSON.stringify(saved),{status:200,headers:{"Content-Type":"application/json"}});}return originalFetch(url,opts);};window.confirm=()=>true;URL.createObjectURL=blob=>{window.testExport=blob;return "blob:test";};URL.revokeObjectURL=()=>{};HTMLAnchorElement.prototype.click=function(){};<\/script>';
 for(const width of [1348,390,768]){
  const editor=document.createElement('iframe'),view=document.createElement('iframe');editor.title=width+'px management';view.title=width+'px preview';editor.style.width=view.style.width=width+'px';document.getElementById('frames').append(editor,view);editor.srcdoc=admin.replace('<head>','<head><base href="/">'+shim);await ready(()=>editor.contentDocument.querySelectorAll('#projects .item').length===4);const w=editor.contentWindow,d=editor.contentDocument,label=width+'px ';w.CV_TEST_TRANSPORT=false;
  check(d.getElementById('authGate').hidden,label+'no login gate');check(d.getElementById('projectPosition').value==='after-knowledge',label+'current section position retained');check(d.getElementById('publishAccessKey').value==='',label+'no publish secret prefilled');
  let token='';w.open=url=>{token=new URL(url,location.href).searchParams.get('preview');view.srcdoc=pub.replace('var previewToken=new URLSearchParams(location.search).get("preview");','var previewToken='+JSON.stringify(token)+';');return {};};
  check(!d.querySelector('.wrap #publishAccessKey'),label+'publish key panel removed');
  check(Array.from(d.querySelectorAll('section.panel')).at(-1).id==='custom-sections',label+'Custom Sections is last form section');
  check(d.querySelector('#custom-sections').lastElementChild.id==='sectionOrderStatus',label+'drag order controls are at the bottom');
  const originalOrder=Array.from(d.querySelector('#sectionOrderList').children).map(x=>x.dataset.sectionId);let save=w.saveDraft();check(d.getElementById('publishConfirm').open,label+'Save opens confirmation popup');check(w.mockWrites===0,label+'opening popup sends no write');
  d.getElementById('confirmPublish').click();check(d.getElementById('publishConfirm').open,label+'missing key keeps popup open');check(d.getElementById('publishConfirmError').textContent.includes('authorization key'),label+'missing key gives popup error');
  d.getElementById('cancelPublish').click();await save;check(w.mockWrites===0,label+'Cancel sends no write');
  save=w.saveDraft();d.getElementById('publishConfirm').dispatchEvent(new Event('cancel',{cancelable:true}));await save;check(!d.getElementById('publishConfirm').open&&w.mockWrites===0,label+'Escape cancel sends no write');
  const initialIndex=originalOrder.indexOf('projects');d.querySelector('[aria-label="Move up Projects & Tools"]').click();check(d.querySelector('#sectionOrderList').children[initialIndex-1].dataset.sectionId==='projects',label+'Move up follows saved order');
  save=w.saveDraft();d.getElementById('publishAccessKey').value='synthetic-test-publish-key';d.getElementById('confirmPublish').click();await save;check(d.getElementById('status').textContent.includes('CV saved'),label+'confirmed mocked Save succeeds');check(d.getElementById('publishAccessKey').value==='',label+'key cleared after Save');await w.loadPublished();check(d.querySelector('#sectionOrderList').children[initialIndex-1].dataset.sectionId==='projects',label+'Save Load retains dragged order');
  const rollback=w.rollbackDraft();check(d.getElementById('publishConfirmTitle').textContent.includes('previous CV'),label+'Rollback popup explains action');d.getElementById('cancelPublish').click();await rollback;check(w.mockWrites===1,label+'cancelled Rollback sends no write');
  save=w.saveDraft();d.getElementById('publishAccessKey').value='wrong-test-key';d.getElementById('confirmPublish').click();await save;check(d.getElementById('status').textContent.includes('valid private publish key'),label+'invalid key remains protected');check(d.getElementById('publishAccessKey').value==='',label+'invalid key cleared');
  const list=d.getElementById('sectionOrderList'),read=()=>Array.from(list.children).map(x=>x.dataset.sectionId);d.querySelector('[aria-label="Move down Projects & Tools"]').click();check(read().indexOf('projects')===initialIndex,label+'Move down restores position');const handle=d.querySelector('[data-section-id="projects"] .section-drag-handle');handle.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true}));check(read().indexOf('projects')===initialIndex-1,label+'keyboard moves section');const target=d.querySelector('[data-section-id="summary"]');handle.setPointerCapture=()=>{};handle.releasePointerCapture=()=>{};handle.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:10,button:0,bubbles:true}));handle.dispatchEvent(new w.PointerEvent('pointermove',{pointerId:10,clientY:target.getBoundingClientRect().top+2,bubbles:true}));handle.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:10,bubbles:true}));check(read()[0]==='projects',label+'pointer drag moves project first');check(d.documentElement.scrollWidth<=width+1,label+'responsive layout no horizontal overflow');check(w.testErrors.length===0,label+'no website JavaScript errors');
 }
 line('ALL CONFIRMATION CHECKS PASSED');
 }catch(e){line('FAIL — '+e.message);}finally{document.getElementById('run').disabled=false;}};
</script>
