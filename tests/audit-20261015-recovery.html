<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>CV recovery audit</title><style>body{font:16px system-ui}pre{white-space:pre-wrap}iframe{display:block;width:390px;height:720px}</style><h1>Isolated editor recovery audit</h1><button id="run">Run recovery checks</button><pre id="results">Ready.</pre><div id="frames"></div><script>
const o=document.getElementById('results'),line=s=>o.textContent+=s+'\n',check=(v,s)=>line((v?'PASS':'FAIL')+' — '+s),pause=ms=>new Promise(r=>setTimeout(r,ms));async function ready(fn){for(let i=0;i<500;i++){try{if(fn())return;}catch{}await pause(25);}throw Error('Timed out');}
document.getElementById('run').onclick=async()=>{o.textContent='';try{const snapshot=await(await fetch('https://aditya-cv-api.onrender.com/api/cv')).json(),admin=await(await fetch('/cv-management/')).text(),pub=(await(await fetch('/')).text()).replace(/<!-- Google Tag Manager -->[\s\S]*?<!-- End Google Tag Manager -->/,'');
for(const mode of ['slow','offline','invalid-json']){const f=document.createElement('iframe');f.title=mode+' editor';document.getElementById('frames').append(f);const shim='<script>window.auditMode='+JSON.stringify(mode)+';window.auditWrites=0;let n=0;const original=fetch;fetch=async(u,opts={})=>{if(!String(u).startsWith("https://aditya-cv-api.onrender.com/api/"))return original(u,opts);if(opts.method&&opts.method!=="GET"){auditWrites++;throw Error("Audit prohibits writes");}n++;window.auditReadStarted=true;await new Promise(r=>setTimeout(r,800));if(n===1&&auditMode==="offline")throw Error("Synthetic offline");if(n===1&&auditMode==="invalid-json")return new Response("malformed",{status:200});return new Response('+JSON.stringify(JSON.stringify(snapshot)).replace(/</g,'\\u003c')+',{status:200,headers:{"Content-Type":"application/json"}});};<\/script>';f.srcdoc=admin.replace('<head>','<head><base href="/">'+shim);await ready(()=>f.contentWindow.auditReadStarted===true&&f.contentDocument.querySelector('.wrap').getAttribute('aria-busy')==='true'&&!f.contentDocument.querySelector('#loadGate').hidden);const w=f.contentWindow,d=f.contentDocument;check(d.querySelector('[onclick="saveDraft()"]').disabled,mode+' Save disabled during load');check(d.querySelector('[onclick="previewCV()"]').disabled,mode+' Preview disabled during load');await ready(()=>d.getElementById('loadGate').hidden);
if(mode!=='slow'){check(d.getElementById('status').textContent.startsWith('Load failed'),mode+' error visible');check(d.querySelector('[onclick="saveDraft()"]').disabled,mode+' Save stays disabled after failed initial read');await w.loadPublished();}
check(d.getElementById('status').textContent.includes('Version '+snapshot.version),mode+' loaded saved version after recovery');check(d.getElementById('name').value===snapshot.data.name,mode+' saved name restored');check(!d.querySelector('[onclick="saveDraft()"]').disabled,mode+' editor enabled after valid read');check(w.auditWrites===0,mode+' no write requests');
if(mode==='slow'){d.getElementById('summary').value='';d.getElementById('knowledgeIntro').value='';d.getElementById('targetLocations').value='';d.getElementById('portfolio').value='';const view=document.createElement('iframe');view.title='Cleared optional fields preview';document.getElementById('frames').append(view);w.open=u=>{let token=new URL(u,location.href).searchParams.get('preview');view.srcdoc=pub.replace('<head>','<head><base href="/">').replace('var previewToken=new URLSearchParams(location.search).get("preview");','var previewToken='+JSON.stringify(token)+';');return {};};w.previewCV();await ready(()=>view.contentDocument.documentElement.dataset.cvSource==='preview');const v=view.contentDocument;check(v.querySelector('.hero .lead').textContent==='', 'cleared summary stays empty in Preview');check(!v.getElementById('targetLocationsContact').textContent,'cleared target locations stay empty in Preview');check(!v.getElementById('portfolioContact').textContent,'cleared portfolio stays empty in Preview');check(!Array.from(v.scripts).some(x=>x.src.includes('googletagmanager')),'Preview excludes GTM');}}
line('RECOVERY AUDIT FINISHED');}catch(e){line('FAIL — '+e.message);}};
</script>
