<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Isolated login and loading checks</title><style>body{font:16px system-ui;margin:24px}pre{white-space:pre-wrap}iframe{width:390px;height:800px;border:1px solid #ddd}button{padding:12px}</style></head><body><h1>Isolated admin login checks</h1><p>All authentication and CV writes in the test frame use temporary memory. No production account or CV is modified.</p><button id="run">Run login checks</button><pre id="results" role="status">Ready.</pre><iframe id="login" title="Phone login test"></iframe><script>
const out=document.getElementById('results');const log=t=>out.textContent+=t+'\n';const check=(value,label)=>{if(!value)throw Error(label);log('PASS — '+label);};
const wait=async f=>{for(let n=0;n<200;n++){if(f())return;await new Promise(r=>setTimeout(r,30));}throw Error('Test frame timed out');};
document.getElementById('run').onclick=async function(){this.disabled=true;out.textContent='Running…\n';try{
 const published=await (await fetch('https://aditya-cv-api.onrender.com/api/cv')).json();const html=await(await fetch('/cv-management/')).text();
 const shim=`<script>let configured=false,authenticated=false;window.testAuthErrors=[];window.addEventListener('error',e=>testAuthErrors.push(e.message));window.addEventListener('unhandledrejection',e=>testAuthErrors.push(String(e.reason)));const original=fetch;window.fetch=async function(url,opts={}){if(!String(url).startsWith('https://aditya-cv-api.onrender.com/api/'))return original(url,opts);await new Promise(r=>setTimeout(r,100));let status=200,data={};if(String(url).includes('/auth/status'))data={configured,authenticated};else if(String(url).endsWith('/auth/setup')){configured=true;authenticated=true;data={token:'T'.repeat(43)};}else if(String(url).endsWith('/auth/login')){let body=JSON.parse(opts.body);if(body.password!=='test-only-password'){status=401;data={error:'Incorrect username or password.'};}else{authenticated=true;data={token:'T'.repeat(43)};}}else if(String(url).endsWith('/auth/logout')){authenticated=false;data={ok:true};}else if(opts.method==='POST'){status=401;authenticated=false;data={error:'Sign in to manage your CV.'};}else data=${JSON.stringify(published).replace(/</g,'\\u003c')};return new Response(JSON.stringify(data),{status,headers:{'Content-Type':'application/json'}});};<\/script>`;
 const frame=document.getElementById('login');frame.srcdoc=html.replace('<script src="/cv-content.js">',shim+'<script src="/cv-content.js">');
 await wait(()=>frame.contentDocument?.getElementById('loginTitle')?.textContent.includes('Set up'));
 const w=frame.contentWindow,d=w.document;check(!d.body.classList.contains('admin-authenticated'),'anonymous editor is hidden');check(!d.getElementById('setupFields').hidden,'first owner setup is offered');
 d.getElementById('adminUsername').value='test-owner';d.getElementById('adminPassword').value='test-only-password';d.getElementById('ownerSetupToken').value='test-only-bootstrap';d.getElementById('loginForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
 await wait(()=>d.getElementById('status').textContent.includes('Version'));
 check(d.body.classList.contains('admin-authenticated'),'setup signs in and loads saved CV');check(d.getElementById('loadGate').hidden,'loading screen closes after data loads');check(!d.getElementById('logoutButton').hidden,'sign out is available');check(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'phone login has no horizontal overflow');
 d.getElementById('logoutButton').click();await wait(()=>!d.body.classList.contains('admin-authenticated'));check(w.sessionStorage.getItem('cv-admin-session')===null,'logout removes token');
 d.getElementById('retryAuth').click();await wait(()=>d.getElementById('loginTitle').textContent==='Welcome back.');check(d.getElementById('setupFields').hidden,'setup key is not requested after owner exists');
 d.getElementById('adminPassword').value='wrong';d.getElementById('loginForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));await wait(()=>d.getElementById('authMessage').textContent.includes('Incorrect'));check(!d.body.classList.contains('admin-authenticated'),'wrong password does not open editor');
 d.getElementById('adminPassword').value='test-only-password';d.getElementById('loginForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));await wait(()=>d.body.classList.contains('admin-authenticated')&&d.getElementById('loadGate').hidden);check(d.getElementById('adminPassword').value==='','password field cleared after login');
 await w.saveDraft();check(!d.body.classList.contains('admin-authenticated'),'expired session returns to login');check(w.testAuthErrors.length===0,'no application JavaScript errors');log('ALL LOGIN CHECKS PASS. Production account/CV writes: 0.');
 }catch(e){log('FAIL — '+e.message);}finally{this.disabled=false;}};
</script></body></html>
