<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Section position and protected publishing checks</title><style>body{font:16px system-ui;margin:20px}iframe{height:700px;margin:20px 0;border:1px solid #ccc;display:block}section{overflow:auto}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Section position and publishing checks</h1><p>All Save/Rollback requests are intercepted in temporary memory. No production writes.</p><button id="run">Run checks</button><pre id="results">Ready.</pre><section id="frames"></section><script>
const output=document.getElementById('results'),line=s=>output.textContent+=s+'\n',check=(v,s)=>{if(!v)throw Error(s);line('PASS — '+s);},pause=ms=>new Promise(r=>setTimeout(r,ms));async function ready(fn){for(let i=0;i<400;i++){try{if(fn())return;}catch{}await pause(25);}throw Error('Frame timed out');}
document.getElementById('run').onclick=async()=>{output.textContent='';document.getElementById('run').disabled=true;try{
 const snapshot=await(await fetch('https://aditya-cv-api.onrender.com/api/cv',{cache:'no-store'})).json(),admin=await(await fetch('/cv-management/?positionTest=1',{cache:'no-store'})).text(),pub=await(await fetch('/?positionTest=1',{cache:'no-store'})).text();
 const shim='<script>window.CV_TEST_TRANSPORT=true;window.mockWrites=0;window.testErrors=[];addEventListener("error",e=>testErrors.push(e.message));addEventListener("unhandledrejection",e=>testErrors.push(String(e.reason)));let saved='+JSON.stringify(snapshot).replace(/</g,'\\u003c')+',history=[];const originalFetch=fetch.bind(window);window.fetch=async(url,opts={})=>{if(String(url).startsWith("https://aditya-cv-api.onrender.com/api/")){if(opts.method&&opts.method!=="GET"){mockWrites++;if(opts.headers["X-CV-Publish-Key"]!=="synthetic-test-publish-key")return new Response(JSON.stringify({error:"Invalid key"}),{status:401});if(String(url).endsWith("/rollback"))saved=history.pop();else{history.push(JSON.parse(JSON.stringify(saved)));saved={...saved,data:JSON.parse(opts.body).data,version:saved.version+1};}}return new Response(JSON.stringify(saved),{status:200,headers:{"Content-Type":"application/json"}});}return originalFetch(url,opts);};window.confirm=()=>true;URL.createObjectURL=blob=>{window.testExport=blob;return "blob:test";};URL.revokeObjectURL=()=>{};HTMLAnchorElement.prototype.click=function(){};<\/script>';
 for(const width of [1348,390,768]){
  const editor=document.createElement('iframe'),view=document.createElement('iframe');editor.title=width+'px management';view.title=width+'px preview';editor.style.width=view.style.width=width+'px';document.getElementById('frames').append(editor,view);editor.srcdoc=admin.replace('<head>','<head>'+shim);await ready(()=>editor.contentDocument.querySelectorAll('#projects .item').length===4);const w=editor.contentWindow,d=editor.contentDocument,label=width+'px ';w.CV_TEST_TRANSPORT=false;
  check(d.getElementById('authGate').hidden,label+'no login gate');check(d.getElementById('projectPosition').value==='after-knowledge',label+'current section position retained');check(d.getElementById('publishAccessKey').value==='',label+'no publish secret prefilled');
  let token='';w.open=url=>{token=new URL(url,location.href).searchParams.get('preview');view.srcdoc=pub.replace('var previewToken=new URLSearchParams(location.search).get("preview");','var previewToken='+JSON.stringify(token)+';');return {};};
  const targets={'after-summary':'summary','after-education':'education','after-skills':'skills','before-knowledge':'knowledge','after-knowledge':'knowledge','before-contact':'contact'};
  for(const [position,target] of Object.entries(targets)){
   d.getElementById('projectPosition').value=position;w.previewCV();await ready(()=>view.contentDocument.querySelector('#projects')?.dataset.projectPosition===position);const p=view.contentDocument.getElementById('projects');check((position.startsWith('before-')?p.nextElementSibling:p.previousElementSibling).id===target,label+position+' Preview order');check(JSON.parse(w.localStorage.getItem('aditya-kadam-cv-draft:preview:'+token)).ui.projectPosition===position,label+position+' snapshot retains selection');
  }
  d.getElementById('projectPosition').value='after-skills';await w.saveDraft();check(w.mockWrites===0,label+'missing key blocks Save locally');check(d.getElementById('status').textContent.includes('private publish key'),label+'missing key explains requirement');
  d.getElementById('publishAccessKey').value='wrong-test-key';await w.saveDraft();check(d.getElementById('authGate').hidden,label+'rejected key never opens login');check(d.getElementById('status').textContent.includes('valid private publish key'),label+'rejected key gives clear error');
  d.getElementById('publishAccessKey').value='synthetic-test-publish-key';await w.saveDraft();check(d.getElementById('status').textContent.includes('CV saved'),label+'mock Save succeeds without login');await w.loadPublished();check(d.getElementById('projectPosition').value==='after-skills',label+'Load Published restores saved position');
  w.exportJSON();const exported=JSON.parse(await w.testExport.text());check(exported.ui.projectPosition==='after-skills',label+'Export JSON contains section position');check(!JSON.stringify(exported).includes('synthetic-test-publish-key')&&!Object.prototype.hasOwnProperty.call(exported,'publishAccessKey'),label+'publish key excluded from export');
  await w.rollbackDraft();check(d.getElementById('projectPosition').value==='after-knowledge',label+'mock Rollback restores original position');check(d.documentElement.scrollWidth<=width+1,label+'responsive management has no overflow');check(w.testErrors.length===0,label+'no management JavaScript errors');
 }
 line('ALL POSITION AND PUBLISHING CHECKS PASSED');
 }catch(e){line('FAIL — '+e.message);}finally{document.getElementById('run').disabled=false;}};
</script>
