<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Project card browser checks</title><style>body{font:16px system-ui;margin:20px}iframe{height:740px;border:1px solid #ccc;display:block;margin:20px 0}pre{white-space:pre-wrap}section{overflow:auto}button{padding:12px}</style><h1>Project card checks</h1><p>Temporary fixture data; all API writes blocked. Public database reads only.</p><button id="run">Run project checks</button><pre id="results">Ready.</pre><section id="frames"></section><script>
const out=document.getElementById('results'),line=s=>out.textContent+=s+'\n';const check=(v,s)=>{if(!v)throw Error(s);line('PASS — '+s);};const pause=ms=>new Promise(r=>setTimeout(r,ms));async function ready(fn){for(let i=0;i<300;i++){if(fn())return;await pause(25);}throw Error('Frame loading timeout');}
document.getElementById('run').onclick=async()=>{out.textContent='';document.getElementById('run').disabled=true;try{
const snapshot=await (await fetch('https://aditya-cv-api.onrender.com/api/cv',{cache:'no-store'})).json();snapshot.data.projects=await (await fetch('/tests/projects-fixture.json')).json();const admin=await (await fetch('/cv-management/?projectsTest=1',{cache:'no-store'})).text(),pub=await (await fetch('/?projectsTest=1',{cache:'no-store'})).text();
const shim='<script>window.CV_TEST_TRANSPORT=true;window.projectErrors=[];window.projectWrites=0;addEventListener("error",e=>projectErrors.push(e.message));addEventListener("unhandledrejection",e=>projectErrors.push(String(e.reason)));const originalFetch=fetch.bind(window);window.fetch=async function(url,opts={}){if(String(url).startsWith("https://aditya-cv-api.onrender.com/api/")){if(opts.method&&opts.method!=="GET"){projectWrites++;return new Response("{}",{status:405});}return new Response('+JSON.stringify(JSON.stringify(snapshot)).replace(/</g,'\\u003c')+',{status:200,headers:{"Content-Type":"application/json"}});}return originalFetch(url,opts);};<\/script>';
for(const width of [1348,390,768]){
const editor=document.createElement('iframe');editor.title=width+'px draft projects';editor.style.width=width+'px';document.getElementById('frames').append(editor);editor.srcdoc=admin.replace('<head>','<head>'+shim);await ready(()=>editor.contentDocument.querySelectorAll('#projects > .item').length===4);const w=editor.contentWindow,d=editor.contentDocument,label=width+'px ';await pause(100);
check(d.querySelectorAll('section.panel').length===13,label+'13 existing sections retained');check(d.querySelectorAll('#projects > .item').length===4,label+'four saved project cards loaded');check(d.querySelector('[data-group="projects"][data-i="1"][data-k="demoUrl"]').value===snapshot.data.projects[1].demoUrl,label+'saved demo link loaded');
w.addProjectCard();check(d.querySelectorAll('#projects > .item').length===5,label+'Add works');w.moveItem('projects',4,-1);check(d.querySelectorAll('#projects > .item')[3].querySelector('[data-k="title"]').value==='New Project',label+'Move Up works');w.moveItem('projects',3,1);check(d.querySelectorAll('#projects > .item')[4].querySelector('[data-k="title"]').value==='New Project',label+'Move Down works');w.removeItem('projects',4);check(d.querySelectorAll('#projects > .item').length===4,label+'Remove works');
d.querySelector('[data-group="projects"][data-i="1"][data-k="demoUrl"]').value='';w.sync();w.render();check(d.querySelector('[data-group="projects"][data-i="1"][data-k="demoUrl"]').value==='',label+'optional demo clearing retained');check(d.documentElement.scrollWidth<=width+1,label+'editor has no horizontal overflow');check(w.projectWrites===0,label+'no API writes');check(w.projectErrors.length===0,label+'no editor JavaScript errors');
const view=document.createElement('iframe');view.title=width+'px public projects';view.style.width=width+'px';document.getElementById('frames').append(view);view.srcdoc=pub.replace('<head>','<head>'+shim);await ready(()=>view.contentDocument.querySelectorAll('.project-card').length===4);const v=view.contentDocument;await pause(150);check(v.querySelectorAll('.project-card').length===4,label+'public project cards render');check(v.querySelectorAll('.project-card a[aria-label^="Live demo"]').length===2,label+'two verified demo buttons');check(v.querySelectorAll('.project-card a[aria-label^="Setup on GitHub"]').length===2,label+'two documented setup buttons');check(!v.querySelector('.project-card a[href*="AR-Form-submitting-extension"]'),label+'private extension uses request-access button');check(v.querySelector('[data-project-id="optimizer-app"]').textContent.includes('No live demo provided'),label+'missing optimizer-app demo labeled honestly');check(v.documentElement.scrollWidth<=width+1,label+'public cards have no horizontal overflow');check(view.contentWindow.projectErrors.length===0,label+'no portfolio JavaScript errors');check(view.contentWindow.projectWrites===0,label+'public rendering makes no writes');
}
line('ALL PROJECT CHECKS PASSED');}catch(e){line('FAIL — '+e.message);}finally{document.getElementById('run').disabled=false;}};
</script>
