<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Compact summary checks</title><style>body{font:16px system-ui}iframe{height:800px;display:block;margin:20px 0}#frames{overflow:auto}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Compact summary checks</h1><button id="run">Run checks</button><pre id="results">Ready.</pre><div id="frames"></div><script>
const out=document.getElementById('results'),check=(v,s)=>{if(!v)throw Error(s);out.textContent+='PASS — '+s+'\n';},pause=ms=>new Promise(r=>setTimeout(r,ms));async function ready(fn){for(let i=0;i<400;i++){if(fn())return;await pause(25);}throw Error('Load timeout');}
document.getElementById('run').onclick=async()=>{out.textContent='';try{const snapshot=await(await fetch('https://aditya-cv-api.onrender.com/api/cv')).json(),html=await(await fetch('/?compactTest=1')).text(),shim='<script>window.summaryErrors=[];addEventListener("error",e=>summaryErrors.push(e.message));addEventListener("unhandledrejection",e=>summaryErrors.push(String(e.reason)));const originalFetch=fetch.bind(window);window.fetch=async(url,opts={})=>{if(String(url).startsWith("https://aditya-cv-api.onrender.com/api/")){if(opts.method&&opts.method!=="GET")throw Error("Writes prohibited");return new Response('+JSON.stringify(JSON.stringify(snapshot)).replace(/</g,'\\u003c')+',{status:200,headers:{"Content-Type":"application/json"}});}return originalFetch(url,opts);};<\/script>';
for(const width of [1348,390,768]){const frame=document.createElement('iframe');frame.title=width+'px portfolio';frame.style.width=width+'px';frame.srcdoc=html.replace('<head>','<head>'+shim);document.getElementById('frames').append(frame);await ready(()=>frame.contentDocument.documentElement.dataset.cvSource==='published');const d=frame.contentDocument,w=frame.contentWindow,reader=d.querySelector('.hero .reader-details'),label=width+'px ';check(Array.from(d.querySelectorAll('[data-summary-copy]')).map(n=>n.textContent).join('')===snapshot.data.summary,label+'every summary character unchanged');check(!d.querySelector('#summary .reader-details'),label+'lower Summary restored');check(!reader.open,label+'hero details initially compact');reader.querySelector('summary').click();check(reader.open&&d.querySelector('.reader-body').getBoundingClientRect().height>0,label+'expand reveals complete approach');reader.querySelector('summary').click();check(!reader.open,label+'collapse works');check(d.documentElement.scrollWidth<=width+1,label+'no horizontal overflow');d.getElementById('themeToggle').click();check(w.getComputedStyle(d.querySelector('.hero .lead')).backgroundColor!=='rgba(0, 0, 0, 0)',label+'theme has opaque readable surface');check(w.summaryErrors.length===0,label+'no website JavaScript errors');}
out.textContent+='ALL COMPACT READER CHECKS PASSED';}catch(e){out.textContent+='FAIL — '+e.message;}};
</script>
