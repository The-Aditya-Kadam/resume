<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Talking preview verification</title><style>body{font:16px system-ui;margin:20px}iframe{height:850px;border:1px solid #ddd;display:block;margin:25px 0}#frames{overflow:auto}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Talking Portfolio preview checks</h1><p>Read-only CV data. No production publishing.</p><button id="run">Run preview checks</button><pre id="results">Ready.</pre><div id="frames"></div><script>
const out=document.getElementById('results'),log=s=>out.textContent+=s+'\n',check=(v,s)=>{if(!v)throw Error(s);log('PASS — '+s);},pause=ms=>new Promise(r=>setTimeout(r,ms));async function ready(fn){for(let i=0;i<800;i++){try{if(fn())return;}catch{}await pause(25);}throw Error('Frame timed out');}
document.getElementById('run').onclick=async()=>{out.textContent='';try{const snapshot=await(await fetch('https://aditya-cv-api.onrender.com/api/cv')).json(),html=await(await fetch('/talking-preview/?test=1')).text(),shim='<script>window.previewErrors=[];window.previewWrites=0;addEventListener("error",e=>previewErrors.push(e.message));addEventListener("unhandledrejection",e=>previewErrors.push(String(e.reason)));const originalFetch=fetch;fetch=async(u,o={})=>{if(String(u).startsWith("https://aditya-cv-api.onrender.com/api/")){if(o.method&&o.method!=="GET"){previewWrites++;throw Error("Writes forbidden");}return new Response('+JSON.stringify(JSON.stringify(snapshot)).replace(/</g,'\\u003c')+',{status:200,headers:{"Content-Type":"application/json"}});}return originalFetch(u,o);};<\/script>';
for(const width of [1440,768,390,360,320]){const frame=document.createElement('iframe');frame.title=width+'px Talking Portfolio';frame.style.width=width+'px';document.getElementById('frames').append(frame);frame.srcdoc=html.replace('<head>','<head><base href="/talking-preview/">'+shim);await ready(()=>frame.contentDocument.documentElement.dataset.ready==='true');const w=frame.contentWindow,d=frame.contentDocument,label=width+'px ';await pause(250);check(d.documentElement.scrollWidth<=width+1,label+'no horizontal overflow');check(d.querySelectorAll('h1').length===1,label+'one primary heading');check(d.querySelector('#about-summary').textContent===snapshot.data.summary,label+'saved summary unchanged');check(d.querySelector('#hero-title').textContent===snapshot.data.role,label+'saved role unchanged');check(d.querySelectorAll('.job').length===snapshot.data.experience.length,label+'all six experience records');const original=d.createElement('div');original.innerHTML=snapshot.presentation.experienceHTML;check(d.querySelectorAll('#jobs li').length===original.querySelectorAll('li').length,label+'all protected responsibilities preserved');check(d.querySelectorAll('.project-card').length===snapshot.data.projects.length,label+'all project cards');check(d.querySelectorAll('.repo').length===snapshot.data.repositories.length,label+'all Knowledge cards');check(d.querySelectorAll('.education-card').length===snapshot.data.education.length,label+'all education records');check(d.querySelectorAll('.award').length===snapshot.data.awards.length,label+'all awards');check(d.querySelector('#resume').getAttribute('href').endsWith(snapshot.data.attachments.resume.url),label+'database resume destination');check(!d.querySelector('a[href*="talking-preview/github.com"]')&&!d.querySelector('a[href*="talking-preview/linkedin.com"]'),label+'bare social domains normalized');check(!d.querySelector('.project-body a[href*="AR-Form-submitting-extension"]'),label+'private project uses request access');check(d.querySelector('meta[name="robots"]').content.includes('noindex'),label+'preview noindex');check(!Array.from(d.scripts).some(x=>x.src.includes('googletagmanager')),label+'no analytics in preview');
const video=d.getElementById('intro');await ready(()=>video.readyState>=1);check(video.videoWidth>0&&video.duration>9&&video.duration<11,label+'professional video metadata loaded');check(video.muted,label+'starts muted');d.querySelector('[data-outfit="casual"]').click();await ready(()=>video.querySelector('source').src.includes('casual.mp4')&&video.readyState>=1);check(d.querySelector('[data-outfit="casual"]').getAttribute('aria-pressed')==='true',label+'casual selection accessible');check(video.videoWidth>0&&video.duration>9,label+'casual clip loads');d.querySelector('[data-outfit="professional"]').click();await ready(()=>video.querySelector('source').src.includes('professional.mp4')&&video.readyState>=1);check(d.querySelector('[data-outfit="professional"]').getAttribute('aria-pressed')==='true',label+'professional selection restores');d.querySelector('#play').click();await pause(100);d.querySelector('#replay').click();await pause(100);check(video.currentTime<2,label+'replay resets playhead');video.pause();d.querySelector('#identity').click();check(d.querySelector('#identity').getAttribute('aria-pressed')==='true',label+'profile card flips');d.querySelector('#identity').click();check(d.querySelector('#identity').getAttribute('aria-pressed')==='false',label+'profile card restores');const second=d.querySelectorAll('.element')[1];second.focus();check(d.querySelector('#inspector-title').textContent===second.querySelector('.skill-name').textContent,label+'keyboard skill inspector');d.querySelectorAll('[data-filter]')[1].click();check(d.querySelectorAll('.element.dimmed').length>0,label+'skill filter dims other categories');d.querySelector('[data-filter="all"]').click();check(!d.querySelector('.element.dimmed'),label+'All skills restores categories');d.querySelectorAll('.project-trigger')[1].click();check(d.querySelectorAll('.project-card.open').length===1&&d.querySelectorAll('.project-trigger')[1].getAttribute('aria-expanded')==='true',label+'project accordion switches');d.querySelector('.job summary').click();check(d.querySelector('.job details').open,label+'responsibilities expand');if(width<=700){d.querySelector('.menu-button').click();check(d.querySelector('#navigation').classList.contains('open'),label+'mobile menu opens');d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check(!d.querySelector('#navigation').classList.contains('open')&&d.body.style.overflow==='',label+'Escape closes menu and unlocks scroll');}check(!d.querySelectorAll('button').length||Array.from(d.querySelectorAll('button')).every(b=>b.textContent.trim()||b.getAttribute('aria-label')),label+'buttons have accessible names');check(w.previewWrites===0,label+'no CV write requests');check(w.previewErrors.length===0,label+'no website JavaScript errors');}
log('ALL TALKING PREVIEW CHECKS PASSED');}catch(e){log('FAIL — '+e.message);}};
</script>
