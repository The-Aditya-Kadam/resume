<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Theme gallery verification</title><style>body{font:16px system-ui;margin:20px}iframe{height:780px;display:block;margin:20px 0;border:1px solid #bbb}#frames{overflow:auto}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Theme gallery verification</h1><p>All writes are mocked in temporary memory. No production publishing.</p><button id="run">Run checks</button><pre id="results">Ready.</pre><div id="frames"></div><script>
const output=document.getElementById('results'),line=s=>output.textContent+=s+'\n',check=(v,s)=>{if(!v)throw Error(s);line('PASS — '+s);},pause=ms=>new Promise(r=>setTimeout(r,ms));async function ready(fn){for(let i=0;i<600;i++){try{if(fn())return;}catch{}await pause(25);}throw Error('Frame timed out');}
document.getElementById('run').onclick=async()=>{output.textContent='';try{
const snapshot=await(await fetch('https://aditya-cv-api.onrender.com/api/cv',{cache:'no-store'})).json(),admin=await(await fetch('/cv-management/?themeTests=1',{cache:'no-store'})).text(),pub=(await(await fetch('/?themeTests=1',{cache:'no-store'})).text()).replace(/<!-- Google Tag Manager -->[\s\S]*?<!-- End Google Tag Manager -->/,'');
const shim='<script>window.CV_TEST_TRANSPORT=true;window.testErrors=[];window.mockWrites=0;addEventListener("error",e=>testErrors.push(e.message));addEventListener("unhandledrejection",e=>testErrors.push(String(e.reason)));let saved='+JSON.stringify(snapshot).replace(/</g,'\\u003c')+';const originalFetch=fetch.bind(window);window.fetch=async(url,opts={})=>{if(String(url).startsWith("https://aditya-cv-api.onrender.com/api/")){if(opts.method&&opts.method!=="GET"){mockWrites++;if(opts.headers["X-CV-Publish-Key"]!=="synthetic-test-publish-key")return new Response("{}",{status:401});saved={...saved,data:JSON.parse(opts.body).data,version:saved.version+1};}return new Response(JSON.stringify(saved),{status:200,headers:{"Content-Type":"application/json"}});}return originalFetch(url,opts);};URL.createObjectURL=blob=>{window.testExport=blob;return "blob:test";};URL.revokeObjectURL=()=>{};HTMLAnchorElement.prototype.click=function(){};<\/script>';
for(const width of [1348,390,768]){
 const editor=document.createElement('iframe'),view=document.createElement('iframe');editor.title=width+'px theme gallery';view.title=width+'px theme preview';editor.style.width=view.style.width=width+'px';document.getElementById('frames').append(editor,view);editor.srcdoc=admin.replace('<head>','<head><base href="/">'+shim);await ready(()=>editor.contentDocument.querySelectorAll('#projects .item').length===snapshot.data.projects.length);const w=editor.contentWindow,d=editor.contentDocument;
 w.exportJSON();const baseline=JSON.parse(await w.testExport.text());let expectedBody='',expectedLinks='';
 for(const theme of ['orbit','professional','studio']){
  const label=width+'px '+theme+' ';d.querySelector('[data-theme-choice="'+theme+'"]').click();check(d.getElementById('themeId').value===theme,label+'gallery selects theme');check(d.querySelector('[data-theme-choice="'+theme+'"]').getAttribute('aria-pressed')==='true',label+'selected state visible');w.exportJSON();const draft=JSON.parse(await w.testExport.text()),copy=JSON.parse(JSON.stringify(baseline));copy.ui.themeId=theme;check(JSON.stringify(draft)===JSON.stringify(copy),label+'only theme ID changes in draft');
  let token='';w.open=url=>{token=new URL(url,location.href).searchParams.get('preview');view.srcdoc=pub.replace('<head>','<head><base href="/">'+shim).replace('var previewToken=new URLSearchParams(location.search).get("preview");','var previewToken='+JSON.stringify(token)+';');return {};};w.previewCV();await ready(()=>view.contentDocument.documentElement.dataset.cvSource==='preview'&&view.contentDocument.documentElement.dataset.theme===theme);const v=view.contentWindow,p=view.contentDocument;await ready(()=>p.getElementById('themesReady')||Array.from(p.styleSheets).some(x=>x.href&&x.href.includes('/themes.css')));await pause(150);
  check(p.documentElement.dataset.theme===theme,label+'Preview applies selected theme');check(Array.from(p.querySelectorAll('[data-hero-copy]')).map(x=>x.textContent).join('')===snapshot.data.summary,label+'summary copy untouched');
  const body=p.querySelector('main').textContent,links=JSON.stringify(Array.from(p.querySelectorAll('main a')).map(x=>[x.textContent,x.getAttribute('href')]));if(!expectedBody){expectedBody=body;expectedLinks=links;}check(body===expectedBody,label+'all portfolio text matches Orbit');check(links===expectedLinks,label+'all portfolio links match Orbit');
  check(p.documentElement.scrollWidth<=width+1,label+'portfolio no overflow');check(d.documentElement.scrollWidth<=width+1,label+'management no overflow');
  const active=p.querySelector('.pcard.is-active');check(active&&active.getBoundingClientRect().width>0,label+'active company visible');if(theme!=='orbit')check(!v.getComputedStyle(active).transform.startsWith('matrix3d('),label+'flat career rendering');
  p.getElementById('nextBtn').click();check(p.getElementById('counter').textContent.startsWith('02'),label+'next company works');p.getElementById('prevBtn').click();check(p.getElementById('counter').textContent.startsWith('01'),label+'previous company works');p.getElementById('stage').dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));check(p.getElementById('counter').textContent.startsWith('02'),label+'career keyboard works');p.getElementById('prevBtn').click();
  p.querySelector('.hero-approach summary').click();check(p.querySelector('.hero-approach').open,label+'hero disclosure works');p.querySelector('.hero-approach summary').click();p.querySelector('#summary .reader-details summary').click();check(p.querySelector('#summary .reader-details').open,label+'Summary disclosure works');p.querySelector('#summary .reader-details summary').click();p.getElementById('themeToggle').click();check(p.body.classList.contains('dark-theme'),label+'dark mode works');p.getElementById('themeToggle').click();
  if(width<=700){p.getElementById('menuBtn').click();check(p.getElementById('navLinks').classList.contains('open'),label+'mobile menu opens');p.getElementById('menuBtn').click();check(!p.getElementById('navLinks').classList.contains('open'),label+'mobile menu closes');}
  check(p.getElementById('resumeLink').getAttribute('href')&&p.getElementById('coverLetterLink').getAttribute('href'),label+'both PDF links retained');await ready(()=>Array.from(p.querySelectorAll('.shot img')).every(x=>x.complete&&x.naturalWidth>0));check(Array.from(p.querySelectorAll('.shot img')).every(x=>x.naturalWidth>0),label+'company logos loaded');
  const saving=w.saveDraft();d.getElementById('publishAccessKey').value='synthetic-test-publish-key';d.getElementById('confirmPublish').click();await saving;check(d.getElementById('status').textContent.includes('CV saved'),label+'mocked Save succeeds');await w.loadPublished();check(d.getElementById('themeId').value===theme,label+'Load restores theme');check(d.querySelector('[data-theme-choice="'+theme+'"]').getAttribute('aria-pressed')==='true',label+'Load restores gallery selection');check(w.testErrors.length===0&&v.testErrors.length===0,label+'no website JavaScript errors');
 }
}
line('ALL THEME CHECKS PASSED');
}catch(e){line('FAIL — '+e.message);}};
</script>
